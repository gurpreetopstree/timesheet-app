name: Flask CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancel redundant in-progress builds on new commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege
permissions:
  contents: read

env:
  DOCKERHUB_REPO: timesheet-python
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  PYTHON_VERSION: "3.12"
  SONAR_PROJECT_KEY: python-timesheet
  TRIVY_CACHE_DIR: .trivy-cache

jobs:
  # --------------------------------------------------
  # 1. Secret Scanning, SAST & Unit Tests
  # --------------------------------------------------
  code-quality-and-security:
    name: Secrets, SAST & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Gitleaks & Sonar history

      # 1. Secret Detection
      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Python Environment with Pip Cache
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # 3. Unit Tests & Coverage Report
      - name: Run unit tests with coverage
        run: |
          pytest --cov=. --cov-report=xml:coverage.xml

      # 4. SonarQube Static Analysis
      - name: SonarQube Code Analysis
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: Quality Gate - SonarQube Server Check
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 5. Trivy Filesystem / Dependencies Scan
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true

      - name: Cache Trivy Vulnerability DB
        uses: actions/cache@v4
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-db-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Quality Gate - Filesystem & Dependencies
        continue-on-error: true
        run: |
          trivy fs . \
            --cache-dir ${{ env.TRIVY_CACHE_DIR }} \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL

  # --------------------------------------------------
  # 2. Container Build, Image Scan & Registry Push
  # --------------------------------------------------
  build-scan-push:
    name: Build, Container Scan & Push
    runs-on: ubuntu-latest
    needs: code-quality-and-security

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.DOCKERHUB_REPO }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Single Build: Load image to local Docker daemon with GHA cache
      - name: Build Local Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true

      - name: Cache Trivy Image DB
        uses: actions/cache@v4
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-image-db-${{ runner.os }}
          restore-keys: |
            trivy-image-db-${{ runner.os }}-

      # Quality Gate: Validates container image
      - name: Quality Gate - Container Image Vulnerabilities
        continue-on-error: true
        run: |
          trivy image ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.DOCKERHUB_REPO }}:${{ steps.meta.outputs.version }} \
            --cache-dir ${{ env.TRIVY_CACHE_DIR }} \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL

      - name: Log in to Docker Hub
        # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushes validated tags safely without bash syntax errors
      - name: Push Validated Images
        # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done
